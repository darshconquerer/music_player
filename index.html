<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIONEER/<title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id = "comic_overlay">
        <div class = "comic_instruction">Click anywhere to continue...</div>
        <div class="comic_panel active">
            <img src="images/one.png" alt="Comic page 1">
        </div>
        <div class="comic_panel">
            <img src="images/two.png" alt="Comic Page 2">
        </div>
        <div class="comic_panel">
            <img src="images/three.png" alt="Comic Page 3">
        </div>
        <div class="comic_panel">
            <img src="images/four.png" alt="Comic Page 4">
        </div>
        <div class="comic_panel">
            <img src="images/five.png" alt="Comic Page 5">
        </div>
    </div>

    <div id="minigame_overlay" style="display: none;">
        <div class="game_ui">
            <h2>System Locked</h2>
            <p>Match the pairs to save yourselves</p>
            <div class="memory_grid" id="memory_grid"></div>
        </div>
    </div>

    <div id="pioneer_app" style="display: none;">
        <div class = 'sidebar'>
            <div class = 'name'>Pioneer
                <div class="navigation_option"></div>
            </div>
            <div class = 'playlist-container'></div>
            <div class="volume_control">
                <span>🔊</span>
                <div class="volume_slider_wrapper">
                    <input type="range" id="volume_bar" min="0" max="1" step="0.01" value="1">
                </div>
            </div>
            <div class="sidebar-controls">
                <div class="playing_now">
                    <div class = song_title>Choose a song</div>
                </div>
                <div class="icons">
                    <div class="buttons">
                        <button class="loop_button">∞</button>
                        <button class = previous_button>⏮</button>
                        <button class="play_button">▶</button>
                        <button class="next_button">⏭</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="main-container">
            <div class="body">
                <h1>SONgs</h1>
                <h3>Click Play or add a song</h3>
                <button class="body_button">Play</button>
            </div>
            <div class="song_list">
                <h2>Songs</h2>
                <div class="add-song-container">
                    <input type="text" id = "new_song_title" placeholder = "Song Title">
                    <input type="file" id="new_song_file" accept="audio/*">
                    <button id="add_song_btn">Add</button>
                </div>
                <ul class="songs"></ul>
            </div>
        </div>

        <div id="custom_alert" class="custom-alert hidden">
            <span id="custom_alert_text"></span>
            <button id="close_alert_btn">Ok</button>
        </div>

        <div class="base">
            <div class="audio_bar">
                <span class="current_time">0:00</span>
                <input type="range" class="audio_prog_bar" min="0" max="100" step="0.1" value="0">
                <span class="total_time">0:00</span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
