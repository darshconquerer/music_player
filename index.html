<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class = 'sidebar'>
        <div class = 'name'>Pioneer
            <div class="navigation_option">
                <a href = '#'>Home</a>
                <a href= "#">Library</a>
            </div>
        </div>
        <div class = 'playlist-container'>
            <ul class = 'playlists'>
                <li>Liked Songs</li>
                <li>Recently Played</li>
                <li>Top Hits</li>
                <li>Coding</li>
                <li>Focus</li>
                <li>Calm</li>
            </ul>
        </div>
    </div>
    <div class="main-container">
        <div class="body">
            <h1>Now that's song</h1>
            <h3>Woah</h3>
            <button class="body_button">Play</button>
        </div>
    </div>
    <div class="base">
        <div class="playing_now">
            <div class = song_title>Choose</div>
        </div>
        <div class="icons">
            <div class="buttons">
                <button class = previous_button>⏮</button>
                <button class="play_button">▶</button>
                <button class="next_button">⏭</button>
            </div>
        </div>
        <div class="audio_bar">
            <span class="current_time">0:00</span>
            <input type="range" class="audio_prog_bar" min="0" max="100" step="0.1" value="0">
            <span class="total_time">0:00</span>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
